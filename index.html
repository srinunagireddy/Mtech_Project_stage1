<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CamPeek</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 520px; margin: 0 auto; padding: 24px 16px; line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  .card { border: 1px solid #8884; border-radius: 12px; padding: 20px; margin-top: 16px; }
  input {
    width: 100%; box-sizing: border-box; padding: 12px; font-size: 1rem;
    border: 1px solid #8886; border-radius: 8px; margin: 8px 0; text-transform: uppercase;
  }
  a.btn, button {
    display: block; width: 100%; box-sizing: border-box; text-align: center;
    padding: 14px; font-size: 1rem; border-radius: 8px; border: none;
    background: #2563eb; color: #fff; text-decoration: none; margin-top: 8px; cursor: pointer;
  }
  .muted { opacity: 0.7; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>CamPeek</h1>
  <p class="muted">A one-way camera link. Both sides open the same room code.</p>

  <div class="card">
    <label for="room"><strong>Room code</strong> (make one up, share it with each other)</label>
    <input id="room" placeholder="e.g. MUMBAI42" />
    <a class="btn" id="share" href="#">Share camera (the phone being watched)</a>
    <a class="btn" id="watch" href="#" style="background:#059669">Watch camera (you)</a>
  </div>

  <p class="muted">Tip: use the same code on both phones. The sharing phone will ask
  permission to use its camera — tap Allow.</p>

<script>
  function go(role) {
    const code = document.getElementById("room").value.trim().toUpperCase();
    if (!code) { alert("Enter a room code first."); return; }
    location.href = role + ".html?room=" + encodeURIComponent(code);
  }
  document.getElementById("share").onclick = (e) => { e.preventDefault(); go("broadcaster"); };
  document.getElementById("watch").onclick = (e) => { e.preventDefault(); go("viewer"); };
</script>
</body>
</html>
